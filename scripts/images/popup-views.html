<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="promo.css">
  <style>
    body { background: #f1f3f4; }

    .views {
      display: flex;
      align-items: flex-start;
      gap: 40px;
      padding: 48px;
    }

    figure { display: flex; flex-direction: column; gap: 16px; }

    /* Screenshots are captured at 2× and shown at their CSS size */
    .frame {
      max-height: 600px;
      overflow: hidden;
      background: #fff;
      border: 1px solid #dadce0;
      border-radius: 10px;
      box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 12px 32px rgba(0,0,0,.12);
    }

    .frame img { display: block; }
    .w300 img { width: 300px; }
    .w380 img { width: 380px; }

    figcaption b { display: block; font-size: 15px; font-weight: 600; }
    figcaption span { display: block; margin-top: 4px; font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="views">
    <figure>
      <div class="frame w300"><img src="/_capture/popup.png" alt=""></div>
      <figcaption><b>Launcher</b><span>Pick a service, then the account</span></figcaption>
    </figure>
    <figure>
      <div class="frame w380"><img src="/_capture/popup-accounts.png" alt=""></div>
      <figcaption><b>Accounts</b><span>Unread mail and apps for each account</span></figcaption>
    </figure>
    <figure>
      <div class="frame w380"><img src="/_capture/popup-account-launcher.png" alt=""></div>
      <figcaption><b>Per-account launcher</b><span>Opens apps straight in that account</span></figcaption>
    </figure>
    <figure>
      <div class="frame w380"><img src="/_capture/popup-sections.png" alt=""></div>
      <figcaption><b>Search, accounts &amp; tabs</b><span>Any dashboard section, in your order</span></figcaption>
    </figure>
  </div>
</body>
</html>
