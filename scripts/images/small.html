<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="promo.css">
  <style>
    .left { position: absolute; inset: 0 180px 0 0; padding: 20px 22px; }
    .brand { gap: 10px; }
    .brand img { padding: 2px; border-radius: 8px; box-shadow: 0 0 0 1px var(--line); }
    .brand span { font-size: 14px; line-height: 1.2; }
    h1 { margin-top: 20px; font-size: 34px; line-height: .95; }
    .pill { position: absolute; left: 22px; bottom: 28px; display: flex; align-items: center; gap: 8px; padding: 5px 12px; border: 1.5px solid var(--ink); border-radius: 14px; font-size: 9px; }
    .pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
    .left .dots { position: absolute; right: 16px; bottom: 34px; }

    .right { position: absolute; top: 0; right: 0; bottom: 6px; width: 180px; background: var(--sand); overflow: hidden; }
    .shot { border-radius: 10px; }
    .shot.options { top: 30px; left: 80px; width: 130px; height: 220px; transform: rotate(4deg); }
    .shot.popup   { top: 18px; left: 8px;  width: 130px; height: 236px; transform: rotate(-4deg); }

    .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; display: flex; }
    .bar i { flex: 1; }
  </style>
</head>
<body>
  <div class="left">
    <div class="brand"><img src="/images/icon.svg" width="36" height="36" alt=""><span>Google Account Chooser<br>(and Dashboard)</span></div>
    <h1 class="serif">Open Gmail.<br><em>On the account</em><br>you meant.</h1>
    <div class="pill mono">Free · Chrome</div>
    <span class="dots"><i></i><i></i><i></i><i></i></span>
  </div>
  <div class="right">
    <div class="shot options"><img src="/_capture/options.png" alt=""></div>
    <div class="shot popup"><img src="/_capture/popup.png" alt=""></div>
  </div>
  <div class="bar">
    <i style="background:var(--blue)"></i><i style="background:var(--red)"></i><i style="background:var(--yellow)"></i><i style="background:var(--green)"></i>
  </div>
</body>
</html>
