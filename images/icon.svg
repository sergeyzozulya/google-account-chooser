<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Google Account Chooser (and Dashboard)</title>
  <desc id="desc">Two overlapping account avatars with arrows indicating account switching.</desc>
  <!-- Account badges -->
  <circle cx="82" cy="79" r="34" fill="#34A853"/>
  <circle cx="47" cy="48" r="34" fill="#4285F4"/>
