  <circle cx="82" cy="73" r="9" fill="#FFFFFF"/>
  <path d="M64 98c0-10 8-16 18-16s18 6 18 16v2H64z" fill="#FFFFFF"/>
  <!-- Directional arrows -->
  <path d="M76 15a47 47 0 0 1 37 39" fill="none" stroke="#EA4335" stroke-width="9" stroke-linecap="round"/>
  <path d="M101 48l13 12 8-15" fill="none" stroke="#EA4335" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M52 113a47 47 0 0 1-37-39" fill="none" stroke="#FBBC05" stroke-width="9" stroke-linecap="round"/>
